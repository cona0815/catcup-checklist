<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貓咪盃備賽檢核系統</title>
<!--
  貓咪盃備賽檢核系統  index.html
  版本：v1.5   日期：2026-09-23（v1.5 整合基礎課程與重複技能）
  作者：Cona 老師（臺南市大橋國小）
  部署：GitHub Pages 單檔；後端 Google Apps Script（Code.gs v1.1）
  設定：下方 CONFIG.GAS_URL 填入 GAS /exec 網址；留空則為純本機模式
-->
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e3e6ea;
  --brand:#2563eb; --brand2:#1e40af; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --anim:#7c3aed; --game:#ea580c; --ai:#0891b2;
  --r:14px; --sh:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --card:#171b21; --ink:#e8eaed; --muted:#9aa3ad; --line:#272d35;
  --brand:#60a5fa; --brand2:#93c5fd; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --anim:#a78bfa; --game:#fb923c; --ai:#22d3ee; --sh:0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1216; --card:#171b21; --ink:#e8eaed; --muted:#9aa3ad; --line:#272d35;
  --brand:#60a5fa; --brand2:#93c5fd; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --anim:#a78bfa; --game:#fb923c; --ai:#22d3ee; --sh:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 0 14px}
header .wrap{padding-bottom:0}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:.5px}
.ver{font-size:.72rem;opacity:.85;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px}
.spacer{flex:1}
.hbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:99px;padding:6px 12px;font-size:.8rem;cursor:pointer;font-family:inherit}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hbtn.on{background:#fff;color:var(--brand2);font-weight:700}
.idbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;font-size:.82rem}
.idbar input,.idbar select{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);
  color:#fff;border-radius:8px;padding:5px 9px;font-family:inherit;font-size:.82rem}
.idbar input::placeholder{color:rgba(255,255,255,.7)}
.idbar select option{color:#111}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;background:transparent;border:0;color:rgba(255,255,255,.82);
  padding:9px 13px;border-radius:10px 10px 0 0;cursor:pointer;font-size:.86rem;font-family:inherit}
nav button.active{background:var(--bg);color:var(--ink);font-weight:700}
section{display:none;padding-top:20px}
section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:1.02rem}
.card h3{margin:16px 0 6px;font-size:.92rem;color:var(--muted)}
.sub{color:var(--muted);font-size:.82rem;margin:0 0 10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.bar.ok>i{background:var(--ok)}
.stat{display:flex;align-items:baseline;gap:6px}
.stat b{font-size:1.5rem}
.stat span{font-size:.78rem;color:var(--muted)}
.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.item:last-child{border-bottom:0}
.item .bd{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:.93rem}
.item .cd{font-size:.79rem;color:var(--muted);margin-top:2px}
.chk{width:26px;height:26px;flex:0 0 26px;border:2px solid var(--line);border-radius:8px;
  background:var(--card);cursor:pointer;font-size:15px;line-height:22px;text-align:center;color:transparent;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.pill.p1{border-color:var(--bad);color:var(--bad)}
.pill.p2{border-color:var(--warn);color:var(--warn)}
.pill.must{border-color:var(--brand);color:var(--brand)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--card);color:var(--muted);font-size:.72rem;padding:5px 8px;
  cursor:pointer;font-family:inherit;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--muted);color:#fff;font-weight:700}
.seg button.on.lv1{background:var(--warn)}
.seg button.on.lv2{background:var(--ok)}
a.lk{display:inline-block;font-size:.78rem;color:var(--brand);text-decoration:none;
  margin:4px 8px 0 0;border-bottom:1px solid transparent}
a.lk:hover{border-bottom-color:var(--brand)}
.course-panel{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.course-panel h3{margin:0 0 4px;color:var(--ink);font-size:1rem}
.course-sites{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 14px}
.course-group{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px;overflow:hidden}
.course-group summary{cursor:pointer;padding:10px 12px;font-weight:700}
.course-group summary:hover{color:var(--brand)}
.course-lessons{padding:0 12px 6px}
.course-lesson{padding:12px 0;border-top:1px dashed var(--line)}
.course-lesson-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.course-lesson-head b{flex:1;min-width:150px}
.course-lesson p{margin:6px 0;white-space:pre-line;font-size:.83rem;color:var(--muted)}
.course-done{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:4px 9px;cursor:pointer;font-family:inherit}
.course-done.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.course-skill{margin:8px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.course-skill>strong{font-size:.8rem;color:var(--brand)}
.course-skill .item{border-bottom:0;padding-bottom:0}
.todo{font-size:.76rem;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:700;font-size:.78rem}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:8px 15px;
  font-size:.85rem;cursor:pointer;font-family:inherit;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=password],textarea,select{border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-family:inherit;font-size:.86rem;background:var(--card);color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.7}
label.fl{display:block;font-size:.8rem;font-weight:600;margin:12px 0 4px}
label.fl .hint{font-weight:400;color:var(--muted);font-size:.74rem}
.note{font-size:.78rem;color:var(--muted);border-left:3px solid var(--brand);padding-left:9px;margin:8px 0}
.ok-txt{color:var(--ok);font-size:.78rem}
.bad-txt{color:var(--bad);font-size:.78rem}
.mock{white-space:pre-wrap;font-size:.86rem;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:14px;line-height:1.85}
.tag{display:inline-block;font-size:.7rem;background:var(--bg);border:1px solid var(--line);
  border-radius:99px;padding:2px 8px;margin:2px 4px 2px 0;color:var(--muted)}
.timer{font-size:2.4rem;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums}
.phase{padding:9px 11px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px;font-size:.84rem}
.phase.now{border-color:var(--brand);background:rgba(37,99,235,.08);font-weight:700}
.phase.done{opacity:.5}
.badge{position:fixed;right:14px;bottom:14px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:7px 14px;font-size:.76rem;box-shadow:var(--sh);z-index:50;display:none}
.badge.show{display:block}
footer{text-align:center;color:var(--muted);font-size:.74rem;padding:24px 0}
.tonly{display:none}
body.teacher .tonly{display:block}
body.teacher .tonly.inline{display:inline-block}
.hide{display:none!important}
.login{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,var(--brand),var(--brand2));
  display:flex;align-items:center;justify-content:center;padding:16px}
.login.off{display:none}
.loginbox{background:var(--card);border-radius:18px;padding:26px 22px;width:100%;max-width:340px;
  box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.loginbox h2{margin:0 0 4px;font-size:1.1rem}
.loginbox p{margin:0 0 16px;font-size:.8rem;color:var(--muted)}
.loginbox input{margin-bottom:9px;text-align:center}
.loginbox .btn{width:100%;padding:10px}
.loginbox .alt{margin-top:14px;font-size:.76rem;color:var(--muted)}
.loginbox .alt a{color:var(--brand);cursor:pointer;text-decoration:none}
.loginbox .alt a:hover{text-decoration:underline}
#liMsg{min-height:20px;font-size:.8rem;margin-top:6px}
.who{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-weight:600}
@media(max-width:640px){
  .item{flex-wrap:wrap}
  .seg{margin-left:36px;margin-top:4px}
  .timer{font-size:2rem}
  h1{font-size:1.05rem}
}
@media print{header,nav,.noprint{display:none!important}section{display:none!important}
  section.active{display:block!important}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <h1>🐱 貓咪盃備賽檢核系統</h1>
      <span class="ver" id="verTag"></span>
      <span class="spacer"></span>
      <button class="hbtn" id="themeBtn" title="切換深淺色">🌓</button>
      <button class="hbtn" id="teacherBtn">老師登入</button>
    </div>
    <div class="idbar" id="idbar"></div>
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap">
  <section id="tab-dash" class="active"></section>
  <section id="tab-feat"></section>
  <section id="tab-skill"></section>
  <section id="tab-rubric"></section>
  <section id="tab-past"></section>
  <section id="tab-mock"></section>
  <section id="tab-doc"></section>
  <section id="tab-time"></section>
  <section id="tab-set"></section>
</div>

<div class="login off" id="login">
  <div class="loginbox">
    <h2>🐱 貓咪盃備賽檢核系統</h2>
    <p>請用老師給的帳號密碼登入</p>

    <input type="password" id="liPw" placeholder="密碼" autocomplete="current-password">
    <button class="btn" id="liGo">登入</button>
    <div id="liMsg"></div>
    <div class="alt"><a id="liTeacher">老師登入</a>　·　<a id="liGuest">暫時不登入</a></div>
  </div>
</div>

<div class="badge" id="badge"></div>
<footer id="foot"></footer>

const SEED_MOCKS = [{"id": "SEED-ANIM-WARMING", "created": "2026-09-18", "group": "anim", "theme": "全球暖化（示範題）", "text": "全國中小學資訊應用競賽 116 年度貓咪盃競賽（模擬）－國小動畫 AI 互動組\n\n題目：北極熊的求救信\n\n情境說明：\n　　地球愈來愈熱了。北極的冰層一年比一年薄，北極熊「小白」站在愈來愈小的浮冰上，寫了一封求救信，隨著洋流漂到臺灣的海邊，被國小學生「阿橋」撿到。阿橋決定化身「減碳小勇士」，從自己的生活做起，並把減碳的方法告訴大家，讓小白的家不再融化。請你設計一段動畫，呈現阿橋發現問題、行動、並改變未來的故事。\n\n任務說明：\n任務一：阿橋在海邊撿到漂流瓶，打開後看見小白的求救信（信的內容用字幕與配音呈現）。畫面切換到北極，呈現冰層逐漸縮小、小白從大浮冰站到小浮冰的變化過程。\n任務二：阿橋回到校園與家裡，找出三種會讓地球變熱的生活壞習慣（例如：冷氣開太強、隨手不關燈、常搭車不走路），並一一示範正確做法。三個壞習慣需在不同場景中呈現，每個場景都要有角色動作、字幕與配音。\n任務三：因為大家一起減碳，北極的冰重新變厚，小白開心地在冰上跳舞，並寄來第二封信感謝阿橋。動畫須在結尾呈現「我學到了什麼」的總結畫面。\n※ 動畫中至少一個劇情轉折須由 AI 感知觸發（例如：觀眾揮手代表「我願意加入減碳」，冰層才開始恢復），畫面上須提示觀眾要做的動作。\n\n程式說明文件題目：\n請依任務一、任務二、任務三完成各任務的敘事設計與分鏡表，並說明任務三中「AI 感知觸發冰層恢復」的流程如何設計。"}, {"id": "SEED-GAME-WARMING", "created": "2026-09-18", "group": "game", "theme": "全球暖化（示範題）", "text": "全國中小學資訊應用競賽 116 年度貓咪盃競賽（模擬）－國小遊戲 AI 互動組\n\n題目：地球降溫大作戰\n\n情境說明：\n　　全球暖化讓臺灣的夏天愈來愈熱，極端天氣也愈來愈多。你是「地球守護隊」的隊員，接到總部任務：先在城市裡收集減碳能量、避開排碳來源，再幫學校規劃一份「低碳生活計畫」，把地球的溫度降下來。請設計一個有兩個關卡的互動遊戲，讓玩家在遊戲中認識暖化的原因，並學會做出低碳的選擇。\n\n任務說明：\n請設計一個有兩個關卡的互動遊戲，第一關著重於「反應與體驗」，第二關著重於「選擇與策略」，兩關不得使用相同的遊戲類型。遊戲主畫面需顯示每關的操作方法、計分規則，以及目前總分最高的三位玩家名稱與各關得分。\n\n任務一：城市減碳大冒險\n說明：玩家操作角色在 60 秒內於城市街道移動，收集從天上掉落的物件。物件類別須以亂數隨機出現，掉落須有加速度變化。計分方式如下，達到 100 分才能過關，否則失敗需重玩：\n　　收集太陽能板　＋10 分\n　　收集腳踏車　　＋5 分\n　　收集樹苗　　　＋5 分\n　　碰到汽車廢氣　－10 分\n　　碰到工廠黑煙　－15 分\n※ 本關角色的左右移動須以 AI 手勢（手掌位置或手勢）操控，並保留鍵盤作為備用操作。\n\n任務二：低碳生活計畫\n說明：學校一天有「能源預算」100 單位。玩家在 90 秒內從 10 種生活行為卡（例如：開冷氣 26 度、開冷氣 20 度、走路上學、家長開車接送、關燈、自備水壺……）中選擇，將卡片拖曳到「今日計畫」區。每張卡有「能源消耗」（1～30 單位）與「減碳分數」（－10～＋20 分）。能源消耗總和不得超過 100，減碳分數總和達 60 分即過關；時間到未過關須重玩本關直到成功。各卡的消耗與分數須在關卡開始前呈現給玩家。\n\n遊戲結束需顯示玩家總得分（兩關合計）、本次成果報告（收集了幾個減碳物件、碰到幾次排碳來源、選了幾張低碳卡），並更新排行榜。\n\n程式說明文件題目：\n請從下列兩個題目中選一項回答：\n1. 任務一中 AI 手勢操控如何設計，並說明如何避免誤判。\n2. 任務二中各行為卡的「能源消耗」與「減碳分數」是怎麼決定的，過關門檻為什麼設 60 分。"}];

  '慕容','鍾離','尉遲','公孫','長孫','宇文','東方','獨孤','南宮','端木','淳于','澹臺','軒轅','太史'];
function maskName(n){
  n=String(n==null?'':n).trim();
  if(!n) return '同學';
  if(/^[A-Za-z]/.test(n)) return n.split(/\s+/)[0]+' 同學';
  const s2=n.slice(0,2);
  return (COMPOUND_SURNAMES.indexOf(s2)>=0 ? s2 : n.slice(0,1))+'同學';
}
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function loadLocal(){
  try{ const r=JSON.parse(localStorage.getItem(LS)||'{}');
    if(r.profile) state.profile={...state.profile,...r.profile};
    if(r.items) state.items=r.items;
    if(r.doc) state.doc={anim:{...r.doc.anim},game:{...r.doc.game}};
    if(r.mocks) state.mocks=r.mocks;
    if(r.links) state.links=r.links;
    if(r.timer) state.timer=r.timer;
    if(r.auth) state.auth=r.auth;
  }catch(e){}
  if(!state.mocks.length) state.mocks = SEED_MOCKS.slice();
}
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify({
    profile:state.profile, items:state.items, doc:state.doc,
    mocks:state.mocks, links:state.links, timer:state.timer, auth:state.auth })); }catch(e){}
}

const api = {
  on(){ return !!CONFIG.GAS_URL; },
  async get(action,params={}){
    if(!this.on()) return null;
    const q=new URLSearchParams({action,...params});
    try{ const r=await fetch(CONFIG.GAS_URL+'?'+q); return await r.json(); }
    catch(e){ return null; }
  },
  async post(action,payload={},password=''){
    if(!this.on()) return null;
    try{
      const r=await fetch(CONFIG.GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({action,payload,password})});
      return await r.json();
    }catch(e){ return null; }
  }
};
let queue=[], flushT=null;
function pushSync(itemType,itemId){
  if(!api.on()||!state.profile.team) return;
  queue.push({itemType,itemId});
  clearTimeout(flushT);
  flushT=setTimeout(flushSync,1500);
}
async function flushSync(){
  if(!queue.length) return;
  const uniq={}; queue.forEach(q=>uniq[q.itemType+q.itemId]=q); queue=[];
  const items=Object.values(uniq).map(q=>{
    const v=state.items[K(q.itemType,q.itemId)]||{};
    return {itemType:q.itemType,itemId:q.itemId,status:v.status===undefined?'':v.status,note:v.note||''};
  });
  const r=await api.post('saveProgress',{...state.profile,items});
  syncTag(r&&r.ok?'☁️ 已同步':'⚠️ 雲端未連線（已存本機）');
}
function syncTag(t){ $('#syncTag').textContent=t; }

async function cloudLoad(){
  if(!api.on()){ syncTag('💾 本機模式'); return; }
  if(!state.profile.team){ syncTag('☁️ 請先輸入隊名'); return; }
  syncTag('☁️ 讀取中…');
  const r=await api.get('getAll',{team:state.profile.team});
  if(!r||!r.ok){ syncTag('⚠️ 雲端未連線'); return; }
  (r.data.progress||[]).forEach(p=>{
    let st=p.status;
    if(p.itemType==='feature') st = (st===true||st==='true'||st===1||st==='TRUE');
    else st = Number(st)||0;
    state.items[K(p.itemType,p.itemId)]={status:st,note:p.note||''};
  });
  if(r.data.mocks&&r.data.mocks.length){
    state.mocks = r.data.mocks.map(m=>({id:m.id,created:m.created,group:m.group,theme:m.theme,text:m.text}));
  }
  if(r.data.links){ state.links={};
    r.data.links.forEach(l=>{ (state.links[l.itemId]=state.links[l.itemId]||[]).push({id:l.id,title:l.title,url:l.url}); });
  }
  saveLocal(); renderAll(); syncTag('☁️ 已同步');
}

const G = ()=>state.profile.group;
const feats = ()=>DATA.features[G()];
const rubric = ()=>DATA.rubric[G()];
function getItem(t,id){ return state.items[K(t,id)]||{status:(t==='feature'?false:0),note:''}; }
function setItem(t,id,patch){
  const cur=getItem(t,id); state.items[K(t,id)]={...cur,...patch};
  saveLocal(); pushSync(t,id);
}
function featDone(){ return feats().filter(f=>getItem('feature',f.id).status).length; }
function skillList(){
  const cats = G()==='anim' ? ['基礎','動畫','AI'] : ['基礎','遊戲','AI'];
  return DATA.skills.filter(s=>cats.includes(s.cat));
}
function skillStat(){
  const l=skillList(); let l2=0,l1=0;
  l.forEach(s=>{const v=getItem('skill',s.id).status; if(v===2)l2++; else if(v===1)l1++;});
  return {total:l.length,l2,l1};
}

function needLogin(){ return api.on() && !state.auth && !state.guest && !teacherPw(); }
function showLogin(){ $('#login').classList.toggle('off',!needLogin()); }
async function doLogin(){
  const acc=$('#liAcc').value.trim(), pw=$('#liPw').value;
  if(!acc) return liMsg('請輸入帳號','bad');
  liMsg('登入中…','');
  const r=await api.post('login',{account:acc,password:pw});
  if(!r){ return liMsg('連不到雲端，請檢查網路，或先按「暫時不登入」','bad'); }
  if(!r.ok){ return liMsg('❌ '+r.error,'bad'); }
  state.auth=r.data;
  state.profile={team:r.data.team||'',name:r.data.name||'',group:r.data.group||'anim'};
  saveLocal(); showLogin(); renderAll(); renderIdbar(); cloudLoad();
  toast('歡迎，'+(maskName(r.data.name)||acc)+'！');
}
function liMsg(t,cls){ const e=$('#liMsg'); e.textContent=t; e.className=cls==='bad'?'bad-txt':'ok-txt'; }
function logout(){
  if(!confirm('要登出嗎？（這台裝置上的勾選紀錄會保留）')) return;
  state.auth=null; state.guest=false; saveLocal(); showLogin(); renderIdbar();
}

function renderSkill(){
  const list=skillList();
  const cats=[...new Set(list.map(s=>s.cat))];
  const oldGroups=[...document.querySelectorAll('#tab-skill .course-group')];
  const openGroups=new Set(oldGroups.filter(group=>group.open).map(group=>Number(group.dataset.courseGroup)));
  if(!oldGroups.length) openGroups.add(1);
  $('#tab-skill').innerHTML=cats.map(c=>`
  <div class="card">
    <h2>${c==='基礎'?'🔧':c==='AI'?'🤖':c==='動畫'?'🎬':'🎮'} ${c}技能
      <span class="pill">${list.filter(s=>s.cat===c&&getItem('skill',s.id).status===2).length}/${list.filter(s=>s.cat===c).length} 精熟</span></h2>
    <p class="sub">「能自己做出來」＝不看範例、10 分鐘內憑記憶重做一次。</p>
    ${c==='基礎'?renderBasicCourse(openGroups):''}
    ${c==='基礎'?`<h3>其他基礎技能（${list.filter(s=>s.cat===c&&!BASIC_SKILL_GROUP[s.id]).length} 項）</h3>`:''}
    ${list.filter(s=>s.cat===c&&(c!=='基礎'||!BASIC_SKILL_GROUP[s.id])).map(skillMarkup).join('')}
  </div>`).join('');
  $('#tab-skill').onclick=async e=>{
    const lessonButton=e.target.closest('[data-basic-lesson]');
    if(lessonButton){
      const id=lessonButton.dataset.basicLesson;
      const done=Number(getItem('lesson',id).status)===1;
      setItem('lesson',id,{status:done?0:1});
      renderSkill();
      return;
    }
    const b=e.target.closest('[data-s]');
    if(b){ setItem('skill',b.dataset.s,{status:Number(b.dataset.v)}); renderSkill(); renderDash(); return; }
    const a=e.target.closest('[data-ladd]');
    if(a){
      const id=a.dataset.ladd;
      const url=document.querySelector(`[data-lu="${id}"]`).value.trim();
      const title=document.querySelector(`[data-lt="${id}"]`).value.trim()||'教學';
      if(!url) return toast('請先輸入網址');
      const r=await api.post('addLink',{itemId:id,title,url},teacherPw());
      const nid=(r&&r.ok)?r.data.id:'L'+Date.now();
      (state.links[id]=state.links[id]||[]).push({id:nid,title,url});
      saveLocal(); renderSkill(); toast(r&&r.ok?'已加入雲端':'已加入本機');
    }
  };
}
function renderBasicCourse(openGroups){
  const lessons=BASIC_COURSE.lessons;
  const done=lessons.filter(lesson=>Number(getItem('lesson',lesson.id).status)===1).length;
  const groups=[...new Set(lessons.map(lesson=>lesson.group))];
  return `<div class="course-panel">
    <h3>📘 ${esc(BASIC_COURSE.title)} <span class="pill">${done}/${lessons.length} 完成</span></h3>
    <p class="sub">依序練習 9 課、19 個單元；完成後可勾選，進度會跟其他檢核項目一起儲存。</p>
    <div class="bar ${done===lessons.length?'ok':''}"><i style="width:${done/lessons.length*100}%"></i></div>
    <h3 style="margin-top:16px">常用網頁</h3>
    <div class="course-sites">${BASIC_COURSE.sites.map(site=>
      `<a class="lk" href="${esc(site.url)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(site.title)}</a>`).join('')}</div>
    ${groups.map(group=>`<details class="course-group" data-course-group="${group}" ${openGroups.has(group)?'open':''}>
      <summary>第 ${group} 課 <span class="pill">${lessons.filter(lesson=>lesson.group===group&&Number(getItem('lesson',lesson.id).status)===1).length}/${lessons.filter(lesson=>lesson.group===group).length} 完成</span></summary>
      <div class="course-lessons">${lessons.filter(lesson=>lesson.group===group).map(lesson=>{
        const completed=Number(getItem('lesson',lesson.id).status)===1;
        return `<div class="course-lesson">
          <div class="course-lesson-head"><b>${esc(lesson.title)}</b>
            <button class="course-done ${completed?'on':''}" data-basic-lesson="${lesson.id}" aria-pressed="${completed}">${completed?'✓ 已完成':'○ 標記完成'}</button></div>
          <p><strong>${esc(lesson.heading)}</strong><br>${esc(lesson.description)}</p>
          ${lesson.video?`<a class="lk" href="${esc(lesson.video)}" target="_blank" rel="noopener noreferrer">▶ 觀看教學影片</a>`:''}
        </div>`;
      }).join('')}</div>
      ${(()=>{
        const skills=DATA.skills.filter(skill=>BASIC_SKILL_GROUP[skill.id]===group);
        return skills.length?`<div class="course-skill"><strong>對應的備賽技能檢核</strong>${skills.map(skillMarkup).join('')}</div>`:'';
      })()}
    </details>`).join('')}
  </div>`;
}
function linkName(u){
  if(u.includes('oxxostudio'))return 'STEAM 教學';
  if(u.includes('junyiacademy'))return '均一影片';
  if(u.includes('github'))return 'GitHub';
  if(u.includes('medium'))return 'Medium 文章';
  if(u.includes('ilc.edu.tw'))return '小忠忠老師';
  if(u.includes('class.tn.edu.tw'))return '進學國小';
  if(u.includes('hashteacher'))return '哈希教學';
  if(u.includes('learningscratch'))return '範例作品';
  if(u.includes('sites.google'))return '教學網站';
  return '教學連結';
}

    <h2>🎤 3 分鐘報告稿（填空）</h2>
    <div class="mock">我們的作品是《＿＿＿》。
故事／玩法是＿＿＿（30 秒）。
我們用 AI 手部辨識來＿＿＿，為了避免誤判，我們設計了＿＿＿（死區／連續判定／狀態燈／鍵盤備援）。
我們最用心的地方是＿＿＿。
這個作品想告訴大家：＿＿＿。謝謝評審。</div>
  </div>
  <div class="card">
    <h2>⚠️ 最常踩的雷</h2>
    <div class="note">配音跟字幕長度不一致 → 用「播放音效直到結束」再換下一句。</div>
    <div class="note">重玩後分身還在、分數沒歸零 → 綠旗與重玩都要「刪除所有分身、變數設為 0」。</div>
    <div class="note">AI 在評審電腦光線不同時失效 → 死區要夠大、狀態燈要顯示、鍵盤備援一定要有。</div>
    <div class="note">文件數字跟程式不一樣 → 填完文件對照程式再檢查一次。</div>
    <div class="note">存檔只有一份 → 一定要另存備份。</div>
  </div>`;
  $('#tStart').onclick=()=>{ if(state.timer.running&&!confirm('重新開始計時？'))return; startTimer(); };
  if($('#tStop')) $('#tStop').onclick=()=>{ state.timer.running=false; saveLocal(); renderTime(); };
  clearInterval(tick);
  if(on) tick=setInterval(()=>{ const e2=Math.floor((Date.now()-state.timer.start)/60000);
    const c=$('#clock'); if(c) c.textContent=fmt(e2); if(e2%1===0&&document.querySelector('#tab-time.active')&&e2!==el) renderTime(); },15000);
}
function fmt(m){ const h=Math.floor(m/60); return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

/* ===================== 設定 ===================== */
function renderSet(){
  $('#tab-set').innerHTML=`

      <select id="stGroup" style="width:auto"><option value="anim">動畫組</option><option value="game">遊戲組</option></select>
      <button class="btn" id="stAdd">新增／更新</button>
      <button class="btn ghost" id="stList">重新整理清單</button>
    </div>
    <h3>批次新增</h3>
    <p class="sub">一行一位，格式：<code>帳號,密碼,姓名,隊名,組別</code>（組別填 anim 或 game）。帳號重複會覆蓋原本那筆。</p>
    <textarea id="stBulk" rows="4" placeholder="s01,1234,王小明,大橋一隊,anim
s02,1234,陳小美,大橋一隊,game"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="stBulkGo">批次匯入</button></div>
    <div id="stOut" style="margin-top:12px"></div>
  </div>
  <div class="card tonly">
    <h2>👩‍🏫 老師工具</h2>
    <div class="row">
      <input type="text" id="newPw" placeholder="新密碼（至少 3 碼）" style="max-width:200px">
      <button class="btn ghost" id="pwBtn">修改教師密碼</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="teamsBtn">📊 查看全班進度</button>
      <input type="text" id="resetTeam" placeholder="要重置的隊名" style="max-width:180px">
      <button class="btn danger" id="resetTeamBtn">重置該隊</button>
    </div>
    <div id="teamsOut" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>🔗 官方連結</h2>
    ${Object.entries(DATA.contest.links).map(([k,v])=>

    <h3>待老師確認的事項</h3>
    ${DATA.contest.todoTeacher.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
  </div>
  <div class="card">
    <h2>📖 賽制重點</h2>
    <table>
      <tr><th>競賽時間</th><td>${DATA.contest.durationMin} 分鐘（原 195）</td></tr>

      <tr><th>競賽軟體</th><td>${esc(DATA.contest.software)}</td></tr>

  $('#expBtn').onclick=()=>{

    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=`貓咪盃進度_${state.profile.team||'未命名'}_${new Date().toISOString().slice(0,10)}.json`; a.click();

  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result);
      state={...state,...d}; saveLocal(); renderAll(); toast('匯入完成'); }catch(x){ toast('檔案格式錯誤'); } };
    r.readAsText(f);
  };
  $('#cloudBtn').onclick=cloudLoad;
  $('#resetBtn').onclick=()=>{ if(confirm('會清除這台裝置上的所有勾選與文件內容，確定？')){
    localStorage.removeItem(LS); location.reload(); } };
  if($('#pwBtn')) $('#pwBtn').onclick=async()=>{
    const p=$('#newPw').value.trim(); if(p.length<3)return toast('至少 3 碼');
    const r=await api.post('setPassword',{newPassword:p},teacherPw());
    toast(r&&r.ok?'密碼已更新':'雲端未連線，無法更新');
  };
  if($('#teamsBtn')) $('#teamsBtn').onclick=async()=>{
    const r=await api.get('getTeams',{password:teacherPw()});
    if(!r||!r.ok) return $('#teamsOut').innerHTML='<p class="sub">雲端未連線或密碼錯誤。</p>';
    $('#teamsOut').innerHTML=`<table><tr><th>隊伍</th><th>組別</th><th>成員</th><th>必做完成</th><th>技能精熟</th><th>最後更新</th></tr>

    const r=await api.post('saveStudent',p,teacherPw());
    toast(r&&r.ok?'已儲存 '+p.account:(r?('失敗：'+r.error):'雲端未連線'));

      $('#stBulk').value=''; loadStudents(); }

  if($('#resetTeamBtn')) $('#resetTeamBtn').onclick=async()=>{
    const t=$('#resetTeam').value.trim(); if(!t)return;
    if(!confirm(`確定清除「${t}」的所有進度？`))return;

async function loadStudents(){
  const box=$('#stOut'); if(!box) return;
  box.innerHTML='<p class="sub">讀取中…</p>';
  const r=await api.get('ping').then(()=>api.post('listStudents',{},teacherPw()));
  if(!r||!r.ok){ box.innerHTML='<p class="sub">'+(r?esc(r.error):'雲端未連線')+'</p>'; return; }
  const L=r.data;
  if(!L.length){ box.innerHTML='<p class="sub">還沒有任何學生帳號。</p>'; return; }
  box.innerHTML=`<table><tr><th>帳號</th><th>密碼</th><th>顯示名稱</th><th>隊名</th><th>組別</th><th></th></tr>
    ${L.map(x=>`<tr><td><b>${esc(x.account)}</b></td><td>${esc(x.password)}</td><td>${esc(maskName(x.name))}</td>
      <td>${esc(x.team)}</td><td>${x.group==='game'?'遊戲':'動畫'}</td>
      <td><button class="btn ghost" data-sted="${esc(x.account)}">改</button>
          <button class="btn danger" data-stdel="${esc(x.account)}">刪</button></td></tr>`).join('')}</table>
    <p class="sub" style="margin-top:8px">共 ${L.length} 位。學生登入網址就是本頁網址。
    為保護個資，網頁一律只顯示「姓＋同學」；完整姓名只存在試算表 <code>students</code> 分頁，需要核對時請開試算表。</p>`;
  box.onclick=async e=>{
    const d=e.target.closest('[data-stdel]');
    if(d){ if(!confirm('確定刪除帳號 '+d.dataset.stdel+'？'))return;
      await api.post('deleteStudent',{account:d.dataset.stdel},teacherPw()); loadStudents(); return; }
    const ed=e.target.closest('[data-sted]');
    if(ed){ const x=L.find(y=>y.account===ed.dataset.sted); if(!x)return;
      $('#stAcc').value=x.account; $('#stPw').value=x.password; $('#stName').value=x.name||'';
      $('#stTeam').value=x.team; $('#stGroup').value=x.group==='game'?'game':'anim';
      $('#stAcc').scrollIntoView({behavior:'smooth',block:'center'}); }
  };
}

/* ===================== 老師模式 ===================== */
function teacherPw(){ return sessionStorage.getItem('catcup_teacher')||''; }
async function teacherLogin(){
  if(teacherPw()){ sessionStorage.removeItem('catcup_teacher'); setTeacherUI(); showLogin(); renderIdbar(); toast('已登出老師模式'); return; }
  const pw=prompt('請輸入教師密碼');
  if(pw===null) return;
  let ok=false;
  const r=await api.post('verifyTeacher',{},pw);
  ok = r ? (r.ok && r.data.teacher) : (pw===CONFIG.TEACHER_PASSWORD_LOCAL);
  if(ok){ sessionStorage.setItem('catcup_teacher',pw); setTeacherUI(); showLogin(); renderAll(); renderIdbar(); toast('✅ 老師模式已開啟'); }
  else toast('❌ 密碼錯誤');
}
function setTeacherUI(){
  const on=!!teacherPw();
  document.body.classList.toggle('teacher',on);
  const b=$('#teacherBtn'); b.textContent=on?'👩‍🏫 老師模式（登出）':'老師登入'; b.classList.toggle('on',on);
}

/* ===================== 啟動 ===================== */
function renderAll(){ renderDash(); renderFeat(); renderSkill(); renderRubric();
  renderPast(); renderMock(); renderDoc(); renderTime(); renderSet(); }
function bindGlobal(){
  document.addEventListener('input',e=>{
    const d=e.target.closest('#tab-doc [data-d]');
    if(d){ state.doc[G()][d.dataset.d]=d.value; saveLocal(); return; }
  });
  document.addEventListener('change',e=>{
    const n=e.target.closest('#tab-feat [data-fn]');
    if(n){ setItem('feature',n.dataset.fn,{note:n.value}); return; }
    if(e.target.closest('#tab-doc [data-d]')){ renderDoc(); renderDash(); }
  });
}
function init(){
  loadLocal(); buildNav(); setTeacherUI(); bindGlobal();
  $('#verTag').textContent=CONFIG.VERSION+'　'+CONFIG.DATE;
  $('#foot').innerHTML=`貓咪盃備賽檢核系統 ${CONFIG.VERSION}（${CONFIG.DATE}）　臺南市大橋國小　資料檔 ${DATA.version}`;
  if(state.auth) state.profile={team:state.auth.team||'',name:state.auth.name||'',group:state.auth.group||state.profile.group};
  renderIdbar(); showLogin();
  $('#liGo').onclick=doLogin;
  $('#liPw').onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
  $('#liAcc').onkeydown=e=>{ if(e.key==='Enter') $('#liPw').focus(); };
  $('#liTeacher').onclick=teacherLogin;
  $('#liGuest').onclick=()=>{ state.guest=true; showLogin(); renderIdbar();
    toast('未登入模式：勾選只會存在這台裝置'); };
  $('#teacherBtn').onclick=teacherLogin;
  $('#themeBtn').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const nx=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nx);
    try{localStorage.setItem('catcup_theme',nx)}catch(e){}
  };
  try{ const t=localStorage.getItem('catcup_theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
  renderAll(); renderIdbar();
  if(api.on()&&state.profile.team) cloudLoad();
}
init();
</script>
