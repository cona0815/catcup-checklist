 A01:['動畫組','標題畫面','讓觀眾一打開作品，就知道作品名稱並能開始。',['選一個標題背景，寫上作品名稱。','加入「開始」角色或按鈕。','按開始時廣播 <code>T1_PLAY</code>，舞台收到後切換到任務一。'],'當綠旗被點擊\n廣播訊息 [HOME v]\n\n當收到訊息 [HOME v]\n背景換成 [HOME v]','綠旗後先看到標題；按開始能進入第一個任務。'],
 A02:['動畫組','每個任務至少一個場景','任務一、二、三各有自己的背景，並能照順序切換。',['準備 <code>T1_PLAY</code>、<code>T2_PLAY</code>、<code>T3_PLAY</code> 三個任務背景。','任務開始時，角色廣播對應代碼。','舞台收到代碼後換成同名背景。'],'當收到訊息 [T1_PLAY v]\n背景換成 [T1_PLAY v]','逐一測三個任務：背景和任務內容要配對；回到上一頁時角色不殘留。'],
 A03:['動畫組','主角每場景有動作＋變化','每一個任務場景中，主角至少移動一次並出現一種變化。',['替主角準備兩個以上造型。','在任務開始時切換造型，再移動或改變大小、顏色。','每個任務都做一次，讓變化配合故事。'],'當收到訊息 [T1_PLAY v]\n換成造型 [開心 v]\n移動 50 點','每個場景都能看見主角動作和造型、大小、顏色或表情變化。'],
 A04:['動畫組','字幕與配音','每個場景至少兩句字幕，每句都有對應語音。',['把一句話拆成短字幕。','使用「說…秒」顯示字幕，同時播放錄音或文字轉語音。','每句字幕和語音長度對齊，再調整下一句等待時間。'],'說 [你好！我們出發吧。] 2 秒\n播放音效 [錄音1 v] 直到結束','靜音看字幕能懂；閉眼聽語音也聽得清楚；字幕沒有太早消失。'],
 A05:['動畫組','音效與背景音樂','每個場景至少一個音效，並有合適的背景音樂。',['為每個場景挑選或錄製一個音效。','選擇不蓋過配音的背景音樂。','進場時播放音樂；動作或事件發生時播放音效。'],'當收到訊息 [T1_PLAY v]\n播放音效 [場景音樂 v] 直到結束','每個場景都有聲音；語音聽得清楚；切場景不會有不合時宜的音樂。'],
 A06:['動畫組','場景轉場至少兩種','作品中使用兩種不同的轉場方式，讓換場更清楚。',['選兩種方式，例如淡出淡入、滑動、縮放。','第一處轉場用「圖像效果」慢慢變化。','第二處換另一種效果；最後清除效果，避免影響下一場景。'],'重複執行 10 次\n  將 [幻影 v] 效果增加 (10)\n背景換成 [T2_PLAY v]\n清除圖像效果','播放完整作品，能看出至少兩種不同轉場，而且角色沒有永久透明或變形。'],
 A08:['動畫組','AI 觸發劇情＋救援方式','AI 動作可以推進劇情；偵測失敗時，按鍵或按鈕仍能繼續。',['先選一個 AI 動作，例如揮手或張嘴。','AI 偵測成功時顯示提示，再推進劇情。','加一個鍵盤或畫面按鈕，做相同的前進功能。'],'當偵測到 [揮手 v]\n廣播訊息 [T2_PLAY v]\n\n當按下 [空白鍵 v]\n廣播訊息 [T2_PLAY v]','AI 正常時能前進；沒有攝影機或偵測不到時，備援按鈕仍可使用。'],

function render(){const title=document.querySelector('#title'),kind=document.querySelector('#kind');if(!lesson){title.textContent='所有必做功能教學';kind.textContent='教學目錄';document.querySelector('#intro').textContent='選一個項目，依照步驟完成，再回網站勾選。';}else{kind.textContent=lesson[0]+'｜'+id;title.textContent=lesson[1];document.querySelector('#intro').textContent='看完成目標，跟著步驟做，最後自己檢查。';document.querySelector('#lesson').classList.remove('hide');document.querySelector('#goal').innerHTML=lesson[2];document.querySelector('#steps').innerHTML=lesson[3].map(s=>`<div class="step">${s}</div>`).join('');document.querySelector('#example').textContent=lesson[4];document.querySelector('#test').textContent=lesson[5];const links=related[id]||[];document.querySelector('#related').innerHTML=links.map(([t,u])=>`<a href="${esc(u)}">${esc(t)}</a>`).join('')||'<span class="muted">照上方步驟完成即可。</span>';}
 const rootIds=Object.keys(lessons).filter(k=>k[0]==='A'||k[0]==='G');document.querySelector('#items').innerHTML=rootIds.map(k=>`<a href="tutorial-feature.html?item=${encodeURIComponent(k)}">${esc(k)}｜${esc(lessons[k][1])}</a>`).join('');}
render();if(lesson)enhanceFeatureGuide(id);
</script>
